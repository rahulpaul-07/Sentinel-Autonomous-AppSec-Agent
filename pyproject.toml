[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-appsec"
version = "0.2.0"
description = "Autonomous AppSec agent that finds, proves, and fixes source-code vulnerabilities."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Rahul Paul" }]
keywords = ["security", "appsec", "llm", "agent", "vulnerability", "sast"]
dependencies = [
    "litellm>=1.92,<2",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/rahulpaul-07/Sentinel-Autonomous-AppSec-Agent"

[project.scripts]
sentinel = "scan:main"
sentinel-eval = "evaluate:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["sentinel"]
py-modules = ["scan", "evaluate"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
