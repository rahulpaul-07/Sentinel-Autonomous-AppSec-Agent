[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-appsec"
version = "0.2.0"
description = "Autonomous AppSec agent that finds, proves, and fixes source-code vulnerabilities."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Rahul Paul" }]
keywords = ["security", "appsec", "llm", "agent", "vulnerability", "sast"]
dependencies = [
    "litellm>=1.92,<2",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/rahulpaul-07/Sentinel-Autonomous-AppSec-Agent"

[project.scripts]
sentinel = "scan:main"
sentinel-eval = "evaluate:main"
sentinel-cve = "benchmark_cves:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14,<0.15"]

[tool.setuptools]
packages = ["sentinel"]
py-modules = ["scan", "evaluate", "benchmark_cves"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Tests marked `docker` drive a real Docker daemon. They are deselected by default
# so `pytest` stays offline; run them with `pytest -m docker`.
markers = ["docker: needs a running Docker daemon"]
addopts = '-m "not docker"'

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["site", "docs", "targets", "tests/fixtures", ".cve-cache"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, pyupgrade, and flake8-bandit security rules.
select = ["E", "F", "W", "B", "UP", "S"]
ignore = [
    "E501",   # long lines: prompts and messages read better unwrapped
    "S101",   # assert is how pytest tests
    "S603", "S607",  # subprocess with argument vectors (never shell=True) to docker/git
    "S108",   # /tmp is the sandbox container's tmpfs, not the host's
]

[tool.ruff.lint.per-file-ignores]
# Tests and examples build deliberately dangerous inputs as data.
"tests/**" = ["S"]
"examples/**" = ["S"]
